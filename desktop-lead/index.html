<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>418 前端</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      /* #app 是 Tauri 透明窗口的内容层,自带 14px 圆角 + 蓝色阴影 + 浅蓝色底,
         让 OS 看到的窗口边缘略带圆角剪影 + 蓝色调更醒目 */
      #app {
        width: 100vw;
        height: 100vh;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.25), 0 8px 28px rgba(37, 99, 235, 0.22);
        background: #f0f6ff;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
