services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CRM_DATABASE_USER:-crm}
      POSTGRES_PASSWORD: ${CRM_DATABASE_PASSWORD:-crm_password}
      POSTGRES_DB: ${CRM_DATABASE_DBNAME:-crm_db}
      TZ: Asia/Shanghai
    ports:
      - "${CRM_DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CRM_DATABASE_USER:-crm} -d ${CRM_DATABASE_DBNAME:-crm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${CRM_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # MinIO（对象存储）- P2 阶段启用
  # 当前 MinIO 镜像在 Docker Hub 上被弃用，需要切到其他镜像源
