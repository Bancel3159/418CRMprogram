  #     MINIO_ROOT_USER: ${CRM_MINIO_ACCESS_KEY:-minio}
  #     MINIO_ROOT_PASSWORD: ${CRM_MINIO_SECRET_KEY:-minio_password}
  #   ports:
  #     - "${CRM_MINIO_PORT:-9000}:9000"
  #     - "${CRM_MINIO_CONSOLE_PORT:-9001}:9001"
  #   volumes:
  #     - minio_data:/data

